server {
    listen 80;

    client_max_body_size 20M;

    # API
    location /mesa_ayuda/api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (Vue). Rutas como /mesa_ayuda/tickets/5 caen en index.html
    location = /mesa_ayuda {
        return 301 /mesa_ayuda/;
    }

    location /mesa_ayuda/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /mesa_ayuda/index.html;
        # index.html siempre fresco para tomar cada nueva versión
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash: se pueden cachear mucho tiempo
    location /mesa_ayuda/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Resto (health, db-check) sigue yendo al backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
