server {
    listen 80;

    client_max_body_size 20M;

    # No anunciar la versión de nginx
    server_tokens off;

    # IP real del visitante: solo se acepta X-Forwarded-For si viene del proxy de confianza
    # (Apache del VPS o la red de Docker). Si un cliente manda ese encabezado por su cuenta,
    # se toma la última IP que no sea de confianza, que es la real.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    # Página: solo recursos propios. 'unsafe-inline' en estilos lo necesita Vuetify.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # API (sin CSP: Swagger en desarrollo carga sus archivos de un CDN)
    location /mesa_ayuda/api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Se reemplazan (no se suman) para que el cliente no pueda inyectar una IP falsa
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (Vue). Rutas como /mesa_ayuda/tickets/5 caen en index.html
    location = /mesa_ayuda {
        return 301 /mesa_ayuda/;
    }

    location /mesa_ayuda/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /mesa_ayuda/index.html;
        # index.html siempre fresco para tomar cada nueva versión
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Manifiesto (ícono al "Agregar a inicio" en Android): nginx no trae su tipo MIME
    location = /mesa_ayuda/manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Archivos con hash: se pueden cachear mucho tiempo
    location /mesa_ayuda/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Resto (health, db-check) sigue yendo al backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
