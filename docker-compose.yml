services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    volumes:
      - ./backend/app/uploads:/app/uploads
    # UVICORN_FLAGS en el .env: "--reload" solo en Local; en el VPS se deja vacío
    command: uvicorn main:app --host 0.0.0.0 --port 8000 ${UVICORN_FLAGS:-}

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    # Usuario, contraseña y base salen del .env (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vol_mesa_final:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - internal

networks:
  internal:

volumes:
  vol_mesa_final: