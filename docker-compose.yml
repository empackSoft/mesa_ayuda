services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    mem_limit: 64m
    memswap_limit: 64m   # igual a mem_limit: sin swap extra, el tope es real
    networks:
      - internal

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    volumes:
      - ./backend/app/uploads:/app/uploads
    # UVICORN_FLAGS en el .env: "--reload" solo en Local; en el VPS se deja vacío
    # --limit-concurrency: "semáforo"; con más de 100 peticiones a la vez responde 503
    # (inténtalo de nuevo) en lugar de amontonarlas hasta agotar la memoria.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --limit-concurrency 100 ${UVICORN_FLAGS:-}
    # Topes para no quitarle recursos a DirectAdmin (correo, sitios). Si un contenedor
    # pasa su tope de memoria, Docker lo detiene y restart: always lo vuelve a levantar.
    mem_limit: 512m
    memswap_limit: 512m   # igual a mem_limit: sin swap extra, el tope es real
    cpus: 1.5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    # Usuario, contraseña y base salen del .env (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vol_mesa_final:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 512m   # igual a mem_limit: sin swap extra, el tope es real
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    # Redis solo guarda contadores de intentos: tope de 64 MB y, si se llena, descarta lo más viejo
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    memswap_limit: 128m   # igual a mem_limit: sin swap extra, el tope es real
    networks:
      - internal

networks:
  internal:

volumes:
  vol_mesa_final: