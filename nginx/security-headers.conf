# Cabeceras de seguridad comunes. Se incluyen en cada location que tiene su propio add_header,
# porque en nginx un add_header dentro de location anula los del server.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Solo tiene efecto cuando el sitio se abre por HTTPS (producción, detrás de Apache)
add_header Strict-Transport-Security "max-age=31536000" always;
